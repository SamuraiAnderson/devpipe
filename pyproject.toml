[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "redpymake"
version = "0.6.0"
description = "跨运行环境的 Python 自动化库：统一的会话接口用于命令执行、文件传输、日志收集与过时判断"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "RedPyMake contributors" }]
keywords = ["automation", "ssh", "adb", "serial", "wsl", "make", "session", "script", "logging"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Systems Administration",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
ssh = ["paramiko>=3.0"]
serial = ["pyserial>=3.5"]
tftp = ["tftpy>=0.8"]
web = [
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "websockets>=12.0",
]
# 浏览器端到端测试（§CORE-11 Web UI 端到端验证）。不并入 dev：浏览器二进制需要
# 额外的 `playwright install chromium`（约 150MB），不该拖进默认开发装。
e2e = [
    "pytest-playwright>=0.5",
    "playwright>=1.44",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "pytest-timeout>=2.2",
    "pytest-mock>=3.12",
    "paramiko>=3.0",
    "pyserial>=3.5",
    "fastapi>=0.110",
    "jinja2>=3.1",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",  # FastAPI TestClient 依赖
]

[project.urls]
Homepage = "https://github.com/RedPyMake/RedPyMake"

[project.scripts]
redpymake = "redpymake._cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
redpymake = [
    "py.typed",
    "_web/static/*.css",
    "_web/static/*.js",
    "_web/static/vendor/*.js",
    "_web/templates/*.html",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
markers = [
    "integration: 需要真实设备或网络的集成测试；默认不运行 (使用 -m integration 运行)",
    "e2e: 需要浏览器的 Web UI 端到端测试；默认不运行 (使用 -m e2e 运行)",
]
# 默认排除集成测试与浏览器 e2e；每条用例设 30s 硬超时避免 wait()/subprocess 挂死 CI。
addopts = "-m 'not integration and not e2e' --timeout=30"

[tool.coverage.run]
source = ["redpymake"]
# _ssh / _adb / _serial / _wsl 需要真实设备或子系统才能充分覆盖，走
# tests/integration/。默认覆盖率报告聚焦"核心包"（对应验收标准 §5/9 的 80%）；
# 跑集成测试时可通过 `pytest -m integration --cov=redpymake` 得到完整覆盖。
omit = [
    "src/redpymake/_ssh.py",
    "src/redpymake/_adb.py",
    "src/redpymake/_serial.py",
    "src/redpymake/_wsl.py",
    # server.py 的主体是路由 + 内联前端资源。`pytest -m e2e` 会在测试进程内起
    # uvicorn，把路由代码真正跑一遍（实测 ~44%），但默认套件不跑 e2e，不排除的话
    # 默认报告会被这千余行拉偏。
    "src/redpymake/_web/server.py",
    # report / commands 同样只被 CLI 报告与 Web UI 路径打到；默认单测目前 0%。
    "src/redpymake/_web/report.py",
    "src/redpymake/_web/commands.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
